  models.MemoryNodePartial:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      description:
        type: string
      groups:
        items:
          $ref: '#/definitions/schema.CardsGroup'
        type: array
      id:
        type: integer
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      priorities:
        items:
          $ref: '#/definitions/schema.CardsPriority'
        type: array
      shared:
        type: boolean
      userId:
        type: integer
    required:
    - id
    type: object
  models.MemoryNodePathItem:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.MemoryNodeShort:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      description:
        type: string
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      shared:
        type: boolean
      userId:
        type: integer
    required:
    - name
    type: object
  models.MoveSharedNodeToUserRequest:
    properties:
      deep:
        type: boolean
      userId:
        type: integer
    required:
    - userId
    type: object
  models.NewCardRequest:
    properties:
      _id:
        type: integer
      answer:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      question:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      shared:
        type: boolean
    required:
    - _id
    - answer
    - question
    type: object
  models.NewMemoryNodeRequest:
    properties:
      memoryNode:
        $ref: '#/definitions/models.MemoryNodeShort'
    required:
    - memoryNode
    type: object
  models.NewUserRequest:
    properties:
      addSampleCards:
        example: true
        type: boolean
      email:
        example: john.doe@example.com
        type: string
      login:
        example: johndoe
        type: string
      name:
        example: John Doe
        type: string
      password:
        example: password
        type: string
    required:
    - email
    - name
    - password
    type: object
  models.OAuthTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: bearer
        type: string
    type: object
  models.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  models.RemoveSharedNodeFromUserRequest:
    properties:
      deep:
        type: boolean
      userId:
        type: integer
    required:
    - userId
    type: object
  models.ResendCodeRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
    required:
    - email
    type: object
  models.SendCodeRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  models.SendCodeResponse:
    properties:
      code:
        example: "482913"
        type: string
    type: object
  models.TextCardInput:
    properties:
      answerTextItems:
        items:
          type: string
        minItems: 1
        type: array
      questionTextItems:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - answerTextItems
    - questionTextItems
    type: object
  models.UpdateCardsFieldRequest:
    properties:
      cards:
        items:
          $ref: '#/definitions/models.CardFieldUpdate'
        type: array
      field:
        description: count
        type: string
    required:
    - cards
    - field
    type: object
  models.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      login:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/schema.UserRole'
      verified:
        type: boolean
    type: object
  models.VerifyUserRequest:
    properties:
      code:
        example: "482913"
        type: string
      email:
        example: john.doe@example.com
        type: string
    required:
    - code
    - email
    type: object
  schema.CardItemType:
    enum:
    - TEXT
    - TEXT_WITH_HIGHLIGHTED_SYMBOL
    - CODE
    - FORMULA
    - IMAGE
    - WORD_WITH_STRESS
    - MARKDOWN
    type: string
    x-enum-varnames:
    - CardItemTypeText
    - CardItemTypeTextWithHighlightedSymbol
    - CardItemTypeCode
    - CardItemTypeFormula
    - CardItemTypeImage
    - CardItemTypeWordWithStress
    - CardItemTypeMarkdown
  schema.CardsGroup:
    properties:
      cards:
        items:
          type: integer
        type: array
      name:
        type: string
    type: object
  schema.CardsPriority:
    properties:
      cards:
        items:
          type: integer
        type: array
      name:
        type: string
      number:
        type: integer
    type: object
  schema.UsageType:
    enum:
    - active
    - passive
    - transitional
    - common
    type: string
    x-enum-varnames:
    - UsageTypeActive
    - UsageTypePassive
    - UsageTypeTransitional
    - UsageTypeCommon
  schema.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
host: localhost:3033
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    Memory nodes, cards, and card items API server.
    **Authentication:** Click **Authorize**, enter your login or email as username and your password, then Authorize. Swagger will call `POST /users/token` and attach the access token as a Bearer header.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: MemoryGuard API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns a welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Root endpoint
      tags:
      - general
  /admin/memory-node/{id}/move-to-user:
    post:
      consumes:
      - application/json
      description: Admin-only. Grants a shared memory node and its shared cards to
        a user. When deep=true, also grants shared descendants recursively.
      parameters:
      - description: Memory node ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target user and deep flag
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.MoveSharedNodeToUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Move shared memory node to user (admin)
      tags:
      - memory-nodes
  /admin/memory-node/{id}/remove-from-user:
    post:
      consumes:
      - application/json
      description: Admin-only. Revokes a user's access by deleting memory_node_users
        / card_users (and card_user_counts) links. Does not delete the node or cards.
        When deep=true, also revokes shared descendants recursively.
      parameters:
      - description: Memory node ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target user and deep flag
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RemoveSharedNodeFromUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Remove shared memory node from user (admin)
      tags:
      - memory-nodes
  /admin/send-code:
    post:
      consumes:
      - application/json
      description: Admin-only. Generates a 6-digit OTP, returns it in the response,
        and sends it to the given email via SMTP.
      parameters:
      - description: Recipient email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SendCodeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Send email verification code (admin)
      tags:
      - admin
  /admin/users/{id}:
    delete:
      description: Admin-only. Deletes the user and their related data (nodes, cards,
        tokens). Admins cannot delete themselves.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Delete a user (admin)
      tags:
      - admin
  /card-item/{id}:
    delete:
      description: Deletes a card item by ID owned by the authenticated user
      parameters:
      - description: Card item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Delete card item
      tags:
      - card-items
    get:
      description: Returns a card item by its ID for the authenticated user
      parameters:
      - description: Card item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CardItemFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Get card item by ID
      tags:
      - card-items
  /card-items:
    get:
      description: Returns all card items for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CardItemFull'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: List card items
      tags:
      - card-items
  /card/{id}:
    get:
      description: Returns a card with resolved question/answer card items for the
        authenticated user
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CardFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Get card by ID
      tags:
      - cards
  /cards:
    get:
      description: Returns cards for the given JSON ids query parameter owned by the
        authenticated user
      parameters:
      - description: JSON array of IDs, e.g. [1,2,3]
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CardFull'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: List cards by IDs (query)
      tags:
      - cards
  /cards-by-query:
    post:
      consumes:
      - application/json
      description: Returns cards for a memory node (or priority/group), filtered by
        a simple query string
      parameters:
      - description: Query request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CardsByQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CardFull'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Filter cards by query
      tags:
      - cards
  /decrease-card-count/{id}:
    put:
      description: Decrements the card count by 1 (not below 0)
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CardFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Decrease card count
      tags:
      - cards
  /delete-cards:
    post:
      consumes:
      - application/json
      description: Deletes owned cards by IDs (including shared cards owned by the
        user). For shared cards the user only has a grant to, removes the grant/count
        records instead of deleting the card.
      parameters:
      - description: List of card IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Delete cards
      tags:
      - cards
  /get-card-items:
    post:
      consumes:
      - application/json
      description: Returns multiple card items by their IDs for the authenticated
        user
      parameters:
      - description: List of card item IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CardItemFull'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Login:
        - api
      summary: Get card items by IDs
      tags:
      - card-items
  /get-cards:
    post:
      consumes:
      - application/json
      description: Returns multiple cards by their IDs for the authenticated user
      parameters:
      - description: List of card IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IDsRequest'
      produces:
      - application/json
      responses:
        "200":
