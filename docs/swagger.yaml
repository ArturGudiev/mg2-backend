            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AccessTokenCookie: []
      summary: Get card by ID
      tags:
      - cards
  /cards:
    get:
      description: Returns cards for the given JSON ids query parameter owned by the
        authenticated user
      parameters:
      - description: JSON array of IDs, e.g. [1,2,3]
        in: query
        name: ids
        required: true
