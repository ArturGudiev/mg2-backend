        type: string
      extension:
        type: string
      formula:
        type: string
      imagePath:
        type: string
      index:
        type: integer
      text:
        type: string
      type:
        $ref: '#/definitions/schema.CardItemType'
      width:
        type: string
    required:
    - type
    type: object
  models.CardPartial:
    properties:
      answer:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      answerIds:
        items:
          type: integer
        type: array
      count:
        type: integer
      id:
        type: integer
      needed:
        type: integer
      parentNodes:
        items:
          type: integer
        type: array
      practiceCount:
        type: integer
      question:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      questionIds:
        items:
          type: integer
        type: array
      reverseCount:
        type: integer
      usageType:
        $ref: '#/definitions/schema.UsageType'
      used:
        type: integer
    required:
    - id
    type: object
  models.CardsByQueryRequest:
    properties:
      group:
