          type: integer
        type: array
    required:
    - ids
    type: object
  models.CardFieldUpdate:
    properties:
      _id:
        type: integer
      count:
        type: integer
      id:
        type: integer
      practiceCount:
        type: integer
    type: object
  models.CardFull:
    properties:
      answer:
        items:
          $ref: '#/definitions/models.CardItemFull'
        type: array
      answerIds:
        items:
          type: integer
        type: array
      count:
        type: integer
      id:
        type: integer
      needed:
        type: integer
      parentNodes:
        items:
          type: integer
        type: array
      practiceCount:
        type: integer
      question:
        items:
          $ref: '#/definitions/models.CardItemFull'
        type: array
      questionIds:
        items:
          type: integer
        type: array
      reverseCount:
        type: integer
      usageType:
        $ref: '#/definitions/schema.UsageType'
      used:
        type: integer
      userId:
        type: integer
    type: object
  models.CardItemFull:
    properties:
      code:
