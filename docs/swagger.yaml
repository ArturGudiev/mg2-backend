    type: object
  models.MemoryNodeFull:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      groups:
        items:
          $ref: '#/definitions/schema.CardsGroup'
        type: array
      id:
        type: integer
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      priorities:
        items:
          $ref: '#/definitions/schema.CardsPriority'
        type: array
      userId:
        type: integer
    type: object
  models.MemoryNodePartial:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      groups:
        items:
          $ref: '#/definitions/schema.CardsGroup'
        type: array
      id:
        type: integer
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      priorities:
        items:
          $ref: '#/definitions/schema.CardsPriority'
        type: array
      userId:
        type: integer
    required:
    - id
    type: object
  models.MemoryNodeShort:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      userId:
        type: integer
    required:
    - name
    type: object
  models.NewCardRequest:
    properties:
      _id:
        type: integer
      answer:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      question:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
    required:
    - _id
    - answer
    - question
    type: object
  models.NewMemoryNodeRequest:
    properties:
      memoryNode:
        $ref: '#/definitions/models.MemoryNodeShort'
    required:
    - memoryNode
    type: object
  models.NewUserRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      name:
        example: John Doe
        type: string
      password:
        example: password
        type: string
    required:
    - email
    - name
    - password
    type: object
  models.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  models.UpdateCardsFieldRequest:
    properties:
      cards:
        items:
          $ref: '#/definitions/models.CardFieldUpdate'
        type: array
      field:
        description: count | practiceCount
        type: string
    required:
    - cards
    - field
    type: object
  models.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  schema.CardItemType:
    enum:
    - TEXT
    - TEXT_WITH_HIGHLIGHTED_SYMBOL
    - CODE
    - FORMULA
    - IMAGE
    - WORD_WITH_STRESS
    type: string
    x-enum-varnames:
    - CardItemTypeText
    - CardItemTypeTextWithHighlightedSymbol
    - CardItemTypeCode
    - CardItemTypeFormula
    - CardItemTypeImage
    - CardItemTypeWordWithStress
  schema.CardsGroup:
    properties:
      cards:
        items:
          type: integer
        type: array
      name:
        type: string
    type: object
  schema.CardsPriority:
    properties:
      cards:
        items:
          type: integer
        type: array
      name:
        type: string
      number:
        type: integer
    type: object
  schema.UsageType:
    enum:
    - active
    - passive
    - transitional
    - common
    type: string
    x-enum-varnames:
    - UsageTypeActive
    - UsageTypePassive
    - UsageTypeTransitional
    - UsageTypeCommon
host: localhost:3033
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    Memory nodes, cards, and card items API server.
    **Authentication:** Use `POST /users/login`, copy `accessToken` from the response, then click **Authorize** and paste it as the `access_token` cookie value. Alternatively, login from Swagger on the same host and cookies are sent automatically.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: MemoryGuard API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns a welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Root endpoint
      tags:
      - general
  /card-item/{id}:
    delete:
      description: Deletes a card item by ID owned by the authenticated user
      parameters:
      - description: Card item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AccessTokenCookie: []
      summary: Delete card item
      tags:
      - card-items
    get:
      description: Returns a card item by its ID for the authenticated user
      parameters:
      - description: Card item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CardItemFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AccessTokenCookie: []
      summary: Get card item by ID
      tags:
      - card-items
  /card-items:
    get:
      description: Returns all card items for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CardItemFull'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
