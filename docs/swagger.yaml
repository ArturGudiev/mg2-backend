        $ref: '#/definitions/models.UserResponse'
    type: object
  models.MemoryNodeFull:
    properties:
      aliases:
        items:
          type: string
        type: array
      cards:
        items:
          type: integer
        type: array
      children:
        items:
          type: integer
        type: array
      description:
        type: string
      groups:
        items:
          $ref: '#/definitions/schema.CardsGroup'
        type: array
      id:
        type: integer
      name:
        type: string
      parents:
        items:
          type: integer
        type: array
      priorities:
        items:
          $ref: '#/definitions/schema.CardsPriority'
