            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AccessTokenCookie: []
      summary: List cards by IDs (query)
      tags:
      - cards
  /cards-by-query:
    post:
      consumes:
