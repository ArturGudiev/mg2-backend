        minItems: 1
        type: array
    required:
    - cards
    type: object
  models.CardFieldUpdate:
    properties:
      _id:
        type: integer
      count:
        type: integer
      id:
        type: integer
    type: object
  models.CardFull:
    properties:
      answer:
        items:
          $ref: '#/definitions/models.CardItemFull'
        type: array
      answerIds:
        items:
          type: integer
        type: array
      count:
        type: integer
      id:
        type: integer
      needed:
        type: integer
      parentNodes:
        items:
          type: integer
        type: array
      question:
        items:
          $ref: '#/definitions/models.CardItemFull'
        type: array
      questionIds:
        items:
          type: integer
        type: array
      reverseCount:
        type: integer
      shared:
        type: boolean
      usageType:
        $ref: '#/definitions/schema.UsageType'
      used:
        type: integer
      userId:
        type: integer
    type: object
  models.CardItemFull:
    properties:
      code:
        type: string
      extension:
        type: string
      formula:
        type: string
      id:
        type: integer
      imagePath:
        type: string
      index:
        type: integer
      shared:
        type: boolean
      text:
        type: string
      type:
        $ref: '#/definitions/schema.CardItemType'
      userId:
        type: integer
      width:
        type: string
    type: object
  models.CardItemPartial:
    properties:
      code:
        type: string
      extension:
        type: string
      formula:
        type: string
      id:
        type: integer
      imagePath:
        type: string
      index:
        type: integer
      shared:
        type: boolean
      text:
        type: string
      width:
        type: string
    required:
    - id
    type: object
  models.CardItemShort:
    properties:
      code:
        type: string
      extension:
        type: string
      formula:
        type: string
      imagePath:
        type: string
      index:
        type: integer
      shared:
        type: boolean
      text:
        type: string
      type:
        $ref: '#/definitions/schema.CardItemType'
      width:
        type: string
    required:
    - type
    type: object
  models.CardPartial:
    properties:
      answer:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      answerIds:
        items:
          type: integer
        type: array
      count:
        type: integer
      id:
        type: integer
      needed:
        type: integer
      parentNodes:
        items:
          type: integer
        type: array
      question:
        items:
          $ref: '#/definitions/models.CardItemShort'
        type: array
      questionIds:
        items:
          type: integer
        type: array
      reverseCount:
        type: integer
      shared:
        type: boolean
      usageType:
        $ref: '#/definitions/schema.UsageType'
      used:
        type: integer
    required:
    - id
    type: object
  models.CardsByQueryRequest:
    properties:
      group:
        $ref: '#/definitions/schema.CardsGroup'
      id:
        type: integer
      priority:
        $ref: '#/definitions/schema.CardsPriority'
      query:
        type: string
    required:
    - id
    type: object
  models.GrantMemoryNodeAccessRequest:
    properties:
      userId:
        type: integer
    required:
    - userId
    type: object
  models.LoginUserRequest:
    properties:
      email:
        description: Email is accepted as an alias for login (backward compatible).
        example: john.doe@example.com
        type: string
      login:
        description: Login accepts either the user's login or email.
        example: johndoe
        type: string
      password:
